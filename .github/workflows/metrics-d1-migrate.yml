name: Protected metrics D1 migration

on:
  workflow_dispatch:
    inputs:
      backup_reference:
        description: "Reference for the approved recovery plan or backup ticket"
        type: string
        required: true
      confirm_production_migration:
        description: "Explicitly confirm this is an approved production migration"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: metrics-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_migration == true
    runs-on: ubuntu-latest
    environment: multiplo-metrics-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create isolated production Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          METRICS_DATABASE_ID: ${{ vars.METRICS_DATABASE_ID }}
          METRICS_RATE_LIMIT_NAMESPACE: ${{ vars.METRICS_RATE_LIMIT_NAMESPACE }}
        run: node scripts/create-metrics-production-config.mjs
      - name: Export and validate current remote D1 backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BACKUP_REFERENCE"
          test -n "$D1_BACKUP_ENCRYPTION_KEY"
          mkdir -p .wrangler/backup
          printf 'Backup reference: %s\n' "$BACKUP_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 export multiplo-metrics-production --remote --config .wrangler/metrics-production.jsonc --output .wrangler/backup/pre-migration.sql
          test -s .wrangler/backup/pre-migration.sql
          npx wrangler d1 execute multiplo-metrics-production --local --config .wrangler/metrics-production.jsonc --file .wrangler/backup/pre-migration.sql
          npx wrangler d1 execute multiplo-metrics-production --local --config .wrangler/metrics-production.jsonc --json --command "PRAGMA integrity_check" > .wrangler/backup/integrity.json
          node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(".wrangler/backup/integrity.json","utf8")); if (!JSON.stringify(result).includes("\"integrity_check\":\"ok\"")) process.exit(1);'
          shasum -a 256 .wrangler/backup/pre-migration.sql
      - name: Encrypt the verified backup before preserving it
        env:
          D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
        run: |
          node scripts/protect-d1-backup.mjs encrypt .wrangler/backup/pre-migration.sql .wrangler/backup/pre-migration.sql.enc
          rm .wrangler/backup/pre-migration.sql
          test -s .wrangler/backup/pre-migration.sql.enc
      - uses: actions/upload-artifact@v4
        with:
          name: multiplo-metrics-pre-migration-backup
          path: .wrangler/backup/pre-migration.sql.enc
          if-no-files-found: error
          retention-days: 30
      - name: Apply explicit remote migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply multiplo-metrics-production --remote --config .wrangler/metrics-production.jsonc -y
      - name: Verify migrated schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute multiplo-metrics-production --remote --config .wrangler/metrics-production.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('daily_metrics','daily_operation_metrics','processed_batches') ORDER BY name" > .wrangler/backup/post-migration.json
          node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(".wrangler/backup/post-migration.json","utf8")); const names=JSON.stringify(result); for (const name of ["daily_metrics","daily_operation_metrics","processed_batches"]) if (!names.includes(name)) process.exit(1);'
