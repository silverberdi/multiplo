name: Protected metrics Worker deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: multiplo-metrics-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create isolated production Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          METRICS_DATABASE_ID: ${{ vars.METRICS_DATABASE_ID }}
          METRICS_RATE_LIMIT_NAMESPACE: ${{ vars.METRICS_RATE_LIMIT_NAMESPACE }}
        run: node scripts/create-metrics-production-config.mjs
      - name: Deploy disabled Worker to the exact metrics route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config .wrangler/metrics-production.jsonc --strict
