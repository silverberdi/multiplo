    name: Desplegar Múltiplo a GitHub Pages

    on:
      push:
        branches: ["main"]
      workflow_dispatch:

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    jobs:
      deploy:
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Instalar Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 22

          - name: Preparar audios Fola
            run: |
              npm ci
              npm run prepare:fola

          - name: Configurar CNAME para subdominio
            run: echo "multiplo.silverman.pro" > CNAME

          - name: Configurar Pages
            uses: actions/configure-pages@v5

          - name: Subir artefacto estático
            uses: actions/upload-pages-artifact@v3
            with:
              path: '.'

          - name: Desplegar a GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v4
