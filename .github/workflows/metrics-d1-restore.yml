name: Restore metrics D1 from protected backup

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "GitHub Actions run ID containing the encrypted pre-migration backup"
        type: string
        required: true
      confirm_restore:
        description: "Confirm restore into the currently configured, empty D1 database"
        type: boolean
        default: false
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: metrics-production-migration
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main' && inputs.confirm_restore == true
    runs-on: ubuntu-latest
    environment: multiplo-metrics-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create isolated production Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          METRICS_DATABASE_ID: ${{ vars.METRICS_DATABASE_ID }}
          METRICS_RATE_LIMIT_NAMESPACE: ${{ vars.METRICS_RATE_LIMIT_NAMESPACE }}
        run: node scripts/create-metrics-production-config.mjs
      - uses: actions/download-artifact@v4
        with:
          name: multiplo-metrics-pre-migration-backup
          run-id: ${{ inputs.backup_run_id }}
          path: .wrangler/backup
          github-token: ${{ github.token }}
      - name: Decrypt and authenticate the selected backup
        env:
          D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
        run: node scripts/protect-d1-backup.mjs decrypt .wrangler/backup/pre-migration.sql.enc .wrangler/backup/pre-migration.sql
      - name: Verify the configured D1 database is empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute multiplo-metrics-production --remote --config .wrangler/metrics-production.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name != 'd1_migrations'" > .wrangler/backup/target-tables.json
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(".wrangler/backup/target-tables.json","utf8")); if (JSON.stringify(data).includes("name")) process.exit(1);'
      - name: Restore authenticated backup into the empty D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute multiplo-metrics-production --remote --config .wrangler/metrics-production.jsonc --file .wrangler/backup/pre-migration.sql
      - name: Verify restored schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute multiplo-metrics-production --remote --config .wrangler/metrics-production.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('daily_metrics','daily_operation_metrics','processed_batches') ORDER BY name" > .wrangler/backup/restored-schema.json
          node -e 'const fs=require("node:fs"); const data=JSON.stringify(JSON.parse(fs.readFileSync(".wrangler/backup/restored-schema.json","utf8"))); for (const name of ["daily_metrics","daily_operation_metrics","processed_batches"]) if (!data.includes(name)) process.exit(1);'
